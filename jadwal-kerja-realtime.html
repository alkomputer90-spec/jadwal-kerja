<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Progress Kerja</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1720">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230F1720'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%2335C2A0' stroke-width='8'/%3E%3Cpath d='M50 22 A28 28 0 0 1 74 62' fill='none' stroke='%23F2A93B' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Firebase SDK (compat, gampang dipakai tanpa build tool) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#0F1720;
    --surface:#161F29;
    --card:#1C2732;
    --card-border:#28353F;
    --text-main:#EDF3F5;
    --text-dim:#7C8FA0;
    --brand:#2FBF9F;
    --done:#35C2A0;
    --progress:#F2A93B;
    --todo:#F0716B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text-main);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{ flex:0 0 auto; padding:20px 20px 0; }
  .title-row{ display:flex; justify-content:space-between; align-items:center; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:0; }
  .conn{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .conn.on{ background:rgba(53,194,160,0.15); color:var(--done); }
  .conn.off{ background:rgba(240,113,107,0.15); color:var(--todo); }
  .today-date{ color:var(--text-dim); font-size:13px; margin-top:2px; }
  .summary{ display:flex; gap:10px; margin:16px 0 4px; }
  .summary-chip{ flex:1; background:var(--surface); border:1px solid var(--card-border); border-radius:14px; padding:10px 12px; text-align:center; }
  .summary-chip .num{ font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; }
  .summary-chip .lbl{ font-size:11px; color:var(--text-dim); margin-top:2px;}
  .num.done{ color:var(--done); } .num.progress{ color:var(--progress); } .num.todo{ color:var(--todo); }

  .tabs{ flex:0 0 auto; display:flex; gap:6px; margin:18px 20px 0; background:var(--surface); padding:4px; border-radius:14px; }
  .tab{ flex:1; text-align:center; padding:10px 4px; border-radius:11px; font-size:13px; font-weight:600; color:var(--text-dim); background:transparent; border:none; font-family:inherit; }
  .tab.active{ background:var(--brand); color:#04231C; }

  .list{ flex:1 1 auto; overflow-y:auto; padding:16px 20px 100px; display:flex; flex-direction:column; gap:12px; }
  .empty{ text-align:center; color:var(--text-dim); padding:60px 20px; font-size:14px; line-height:1.6; }
  .card{ background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:14px 16px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-title{ font-size:15px; font-weight:600; line-height:1.35; }
  .card-date{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .badge{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
  .badge.belum{ background:rgba(240,113,107,0.15); color:var(--todo); }
  .badge.sedang{ background:rgba(242,169,59,0.15); color:var(--progress); }
  .badge.selesai{ background:rgba(53,194,160,0.15); color:var(--done); }

  .progress-row{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .progress-track{ flex:1; height:7px; background:#0F1720; border-radius:10px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:10px; transition:width 0.2s ease; }
  .progress-pct{ font-size:12px; font-weight:700; color:var(--text-dim); min-width:32px; text-align:right; }

  .fab{ position:fixed; right:24px; bottom:calc(24px + env(safe-area-inset-bottom)); width:56px; height:56px; border-radius:50%; background:var(--brand); color:#04231C; border:none; font-size:28px; box-shadow:0 6px 20px rgba(47,191,159,0.35); display:flex; align-items:center; justify-content:center; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; }
  .sheet h2{ font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 16px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  .field input[type="text"], .field input[type="date"]{ width:100%; background:var(--card); border:1px solid var(--card-border); color:var(--text-main); padding:12px 14px; border-radius:12px; font-size:15px; font-family:inherit; }
  .status-toggle{ display:flex; gap:8px; }
  .status-toggle button{ flex:1; padding:10px 4px; border-radius:12px; border:1px solid var(--card-border); background:var(--card); color:var(--text-dim); font-size:12px; font-weight:700; font-family:inherit; }
  .status-toggle button.sel-belum{ background:rgba(240,113,107,0.18); color:var(--todo); border-color:var(--todo); }
  .status-toggle button.sel-sedang{ background:rgba(242,169,59,0.18); color:var(--progress); border-color:var(--progress); }
  .status-toggle button.sel-selesai{ background:rgba(53,194,160,0.18); color:var(--done); border-color:var(--done); }
  .slider-row{ display:flex; align-items:center; gap:12px; }
  input[type=range]{ flex:1; accent-color:var(--brand); }
  .slider-val{ font-family:'Space Grotesk',sans-serif; font-weight:700; min-width:38px; text-align:right; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; padding:14px; border-radius:12px; border:none; font-size:14px; font-weight:700; font-family:inherit; }
  .btn-save{ background:var(--brand); color:#04231C; }
  .btn-cancel{ background:var(--card); color:var(--text-dim); border:1px solid var(--card-border); }
  .btn-delete{ background:rgba(240,113,107,0.15); color:var(--todo); border:1px solid var(--todo); }

  .setup-warning{
    margin:20px; padding:16px; background:rgba(242,169,59,0.12); border:1px solid var(--progress);
    border-radius:14px; font-size:13px; line-height:1.6; color:var(--text-main);
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Progress Kerja</h1>
    <span class="conn off" id="connBadge">Menghubungkan...</span>
  </div>
  <div class="today-date" id="todayDate"></div>
  <div class="summary" id="summary"></div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="hari">Hari Ini</button>
  <button class="tab" data-tab="minggu">Minggu Ini</button>
  <button class="tab" data-tab="bulan">Bulan Ini</button>
</div>

<div class="list" id="list"></div>

<button class="fab" id="fabAdd">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Tambah Pekerjaan</h2>
    <div class="field">
      <label>Judul Pekerjaan</label>
      <input type="text" id="fTitle" placeholder="Contoh: Paparan KKP Biro Hukum Kemenhan">
    </div>
    <div class="field">
      <label>Tanggal</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>Status</label>
      <div class="status-toggle" id="statusToggle">
        <button type="button" data-status="belum">Belum</button>
        <button type="button" data-status="sedang">Sedang</button>
        <button type="button" data-status="selesai">Selesai</button>
      </div>
    </div>
    <div class="field">
      <label>Progress</label>
      <div class="slider-row">
        <input type="range" id="fProgress" min="0" max="100" value="0">
        <div class="slider-val" id="progressVal">0%</div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="btnCancel">Batal</button>
      <button class="btn btn-save" id="btnSave">Simpan</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none; margin-top:10px;">
      <button class="btn btn-delete" id="btnDelete">Hapus Pekerjaan</button>
    </div>
  </div>
</div>

<script>
// ====================================================================
// GANTI BAGIAN INI dengan konfigurasi dari Firebase Console kamu.
// Cara dapatnya: Firebase Console -> Project Settings -> scroll ke
// "Your apps" -> Web app -> "SDK setup and configuration" -> pilih "Config"
// lalu copy semua isinya ke sini.
// ====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyAVJwggJpS8tA6zaQJpgvAwYVRQeZ_tkKc",
  authDomain: "progress-kerja.firebaseapp.com",
  databaseURL: "https://progress-kerja-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "progress-kerja",
  storageBucket: "progress-kerja.firebasestorage.app",
  messagingSenderId: "996691495573",
  appId: "1:996691495573:web:59e1d7ed91cdc795c9699c"
};
// ====================================================================

(function(){
  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('GANTI');

  if (!isConfigured){
    document.body.innerHTML = `
      <div class="setup-warning">
        <strong>Konfigurasi belum diisi.</strong><br><br>
        Aplikasi ini butuh koneksi ke Firebase supaya data bisa dipantau bersama secara real-time.
        Buka file HTML ini, cari bagian <code>firebaseConfig</code> di dalam kode,
        lalu ganti dengan konfigurasi dari project Firebase kamu sendiri.
      </div>`;
    return;
  }

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const tasksRef = db.ref('tasks');

  const connBadge = document.getElementById('connBadge');
  db.ref('.info/connected').on('value', (snap)=>{
    if (snap.val() === true){
      connBadge.textContent = 'Tersambung'; connBadge.className = 'conn on';
    } else {
      connBadge.textContent = 'Terputus'; connBadge.className = 'conn off';
    }
  });

  let tasks = [];
  let currentTab = 'hari';
  let editingId = null;
  let selectedStatus = 'belum';

  const todayDateEl = document.getElementById('todayDate');
  const summaryEl = document.getElementById('summary');
  const listEl = document.getElementById('list');
  const overlay = document.getElementById('overlay');
  const sheetTitle = document.getElementById('sheetTitle');
  const fTitle = document.getElementById('fTitle');
  const fDate = document.getElementById('fDate');
  const fProgress = document.getElementById('fProgress');
  const progressVal = document.getElementById('progressVal');
  const statusToggle = document.getElementById('statusToggle');
  const deleteRow = document.getElementById('deleteRow');

  const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const hariNama = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtDateDisplay(iso){
    const d = new Date(iso + 'T00:00:00');
    return hariNama[d.getDay()] + ', ' + d.getDate() + ' ' + bulanNama[d.getMonth()] + ' ' + d.getFullYear();
  }
  function getWeekRange(){
    const now = new Date();
    const day = now.getDay();
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday); monday.setHours(0,0,0,0);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
    return {start: monday, end: sunday};
  }
  function isInRange(iso, start, end){
    const d = new Date(iso + 'T12:00:00');
    return d >= start && d <= end;
  }
  function filterTasks(){
    const today = todayStr();
    if (currentTab === 'hari') return tasks.filter(t => t.date === today);
    if (currentTab === 'minggu'){ const {start,end} = getWeekRange(); return tasks.filter(t => isInRange(t.date, start, end)); }
    const now = new Date();
    return tasks.filter(t => { const d = new Date(t.date + 'T12:00:00'); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); });
  }
  function statusColor(status){ return status==='selesai' ? 'var(--done)' : status==='sedang' ? 'var(--progress)' : 'var(--todo)'; }
  function statusLabel(status){ return status==='selesai' ? 'Selesai' : status==='sedang' ? 'Sedang' : 'Belum'; }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function render(){
    todayDateEl.textContent = fmtDateDisplay(todayStr());
    const filtered = filterTasks().sort((a,b)=> a.date.localeCompare(b.date));
    const done = filtered.filter(t=>t.status==='selesai').length;
    const prog = filtered.filter(t=>t.status==='sedang').length;
    const todo = filtered.filter(t=>t.status==='belum').length;
    summaryEl.innerHTML = `
      <div class="summary-chip"><div class="num done">${done}</div><div class="lbl">Selesai</div></div>
      <div class="summary-chip"><div class="num progress">${prog}</div><div class="lbl">Sedang</div></div>
      <div class="summary-chip"><div class="num todo">${todo}</div><div class="lbl">Belum</div></div>
    `;
    if (filtered.length === 0){
      const msg = currentTab === 'hari' ? 'Belum ada pekerjaan untuk hari ini.'
                : currentTab === 'minggu' ? 'Belum ada pekerjaan untuk minggu ini.'
                : 'Belum ada pekerjaan untuk bulan ini.';
      listEl.innerHTML = `<div class="empty">${msg}<br>Ketuk tombol + untuk menambahkan.</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(t => `
      <div class="card" data-id="${t.id}">
        <div class="card-top">
          <div>
            <div class="card-title">${escapeHtml(t.title)}</div>
            <div class="card-date">${fmtDateDisplay(t.date)}</div>
          </div>
          <div class="badge ${t.status}">${statusLabel(t.status)}</div>
        </div>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${t.progress}%; background:${statusColor(t.status)};"></div></div>
          <div class="progress-pct">${t.progress}%</div>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=> openEdit(card.dataset.id));
    });
  }

  tasksRef.on('value', (snapshot)=>{
    const val = snapshot.val() || {};
    tasks = Object.keys(val).map(id => ({ id, ...val[id] }));
    render();
  });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      render();
    });
  });

  function setSelectedStatus(status){
    selectedStatus = status;
    statusToggle.querySelectorAll('button').forEach(b=>{
      b.classList.remove('sel-belum','sel-sedang','sel-selesai');
      if (b.dataset.status === status) b.classList.add('sel-' + status);
    });
  }
  statusToggle.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=> setSelectedStatus(b.dataset.status));
  });
  fProgress.addEventListener('input', ()=>{ progressVal.textContent = fProgress.value + '%'; });

  function openAdd(){
    editingId = null;
    sheetTitle.textContent = 'Tambah Pekerjaan';
    fTitle.value = ''; fDate.value = todayStr();
    fProgress.value = 0; progressVal.textContent = '0%';
    setSelectedStatus('belum');
    deleteRow.style.display = 'none';
    overlay.classList.add('show');
  }
  function openEdit(id){
    const t = tasks.find(x=>x.id === id);
    if (!t) return;
    editingId = id;
    sheetTitle.textContent = 'Edit Pekerjaan';
    fTitle.value = t.title; fDate.value = t.date;
    fProgress.value = t.progress; progressVal.textContent = t.progress + '%';
    setSelectedStatus(t.status);
    deleteRow.style.display = 'flex';
    overlay.classList.add('show');
  }
  function closeSheet(){ overlay.classList.remove('show'); }

  document.getElementById('fabAdd').addEventListener('click', openAdd);
  document.getElementById('btnCancel').addEventListener('click', closeSheet);
  overlay.addEventListener('click', (e)=>{ if (e.target === overlay) closeSheet(); });

  document.getElementById('btnSave').addEventListener('click', ()=>{
    const title = fTitle.value.trim();
    if (!title){ fTitle.focus(); return; }
    const date = fDate.value || todayStr();
    const progress = parseInt(fProgress.value, 10);
    let status = selectedStatus;
    if (progress === 100) status = 'selesai';

    if (editingId){
      tasksRef.child(editingId).update({ title, date, progress, status });
    } else {
      tasksRef.push({ title, date, progress, status });
    }
    closeSheet();
  });

  document.getElementById('btnDelete').addEventListener('click', ()=>{
    tasksRef.child(editingId).remove();
    closeSheet();
  });

  render();
})();
</script>
</body>
</html>
